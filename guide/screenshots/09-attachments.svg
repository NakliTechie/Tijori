  <g transform="translate(32,474)">
    <rect width="326" height="34" rx="8" fill="#1b2026" stroke="#262c34"/>
    <text x="12" y="22" font-size="13">📎</text>
    <text x="36" y="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#e6e8eb">id_ed25519</text>
    <text x="150" y="22" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#8a94a3">464 B</text>
    <text x="196" y="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#ffc857">not on this device</text>
