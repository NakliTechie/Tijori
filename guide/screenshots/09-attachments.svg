  <text x="32" y="530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#5a6676">Own key per file · QR carries ≤ 64 KB · LAN and folder sync carry all</text>

  <line x1="32" y1="600" x2="358" y2="600" stroke="#262c34"/>
  <rect x="32" y="616" width="64" height="30" rx="7" fill="#ff6b6b"/>
