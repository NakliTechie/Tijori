    <text x="206" y="22" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#8a94a3">2.4 MB</text>
    <rect x="252" y="6" width="26" height="22" rx="6" fill="transparent" stroke="#262c34"/><text x="265" y="21" text-anchor="middle" font-size="11" fill="#8a94a3">👁</text>
    <rect x="284" y="6" width="26" height="22" rx="6" fill="transparent" stroke="#262c34"/><text x="297" y="22" text-anchor="middle" font-size="13" fill="#8a94a3">⤓</text>
    <text x="318" y="23" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#8a94a3">×</text>
