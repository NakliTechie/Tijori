name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  storage-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-naklios-storage.mjs
      - run: node scripts/make-test-vault.mjs --check
      - run: node scripts/test-qr-transport.mjs
