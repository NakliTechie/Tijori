name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # the vendor job dispatches this after an SDK refresh

permissions:
  contents: read

jobs:
  storage-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
