name: Notify NakliOS to re-mirror

# When index.html changes on main, ping nakli-dev to re-pull Tijori into
# its same-origin mirror at naklios.dev/apps/tijori/. The sync workflow
# there opens a PR with any drift, which Chirag reviews + merges.
#
# Uses NAKLIOS_DISPATCH_TOKEN when configured. Without it, this workflow exits
# successfully and nakli-dev's six-hour scheduled sync provides the fallback.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/notify-naklios.yml'
  workflow_dispatch:

jobs:
  trigger-mirror:
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.NAKLIOS_DISPATCH_TOKEN }}
    steps:
      - name: Trigger nakli-dev sync workflow
        if: env.DISPATCH_TOKEN != ''
        run: gh workflow run sync-mirrors.yml --repo NakliTechie/nakli-dev --ref main
        env:
          GH_TOKEN: ${{ env.DISPATCH_TOKEN }}

      - name: Use scheduled-sync fallback
        if: env.DISPATCH_TOKEN == ''
        run: echo "NAKLIOS_DISPATCH_TOKEN is not configured; nakli-dev will discover this release on its six-hour sync."
